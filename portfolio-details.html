<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study — Adonis T Mushonga</title>
  <meta name="description" content="Project case study — Adonis T Mushonga, Full-Stack Software Engineer.">
  <link href="assets/img/favicon.png" rel="icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/site.css?v=4">
</head>
<body>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav__brand">Adonis<b>.</b>M</a>
    <div class="nav__links">
      <a href="index.html#work"><span class="idx">01</span>Work</a>
      <a href="index.html#about"><span class="idx">02</span>About</a>
      <a href="index.html#contact" class="nav__cta">Get in touch</a>
    </div>
  </nav>

  <main id="top">
    <header class="cs-hero wrap">
      <a href="index.html#work" class="cs-back" data-reveal>← Back to work</a>
      <h1 class="cs-title" id="cs-title" data-reveal data-reveal-delay="1">Case Study</h1>
      <p class="cs-tagline" id="cs-tagline" data-reveal data-reveal-delay="2"></p>
      <div class="cs-cover" id="cs-cover" data-reveal data-reveal-delay="2"></div>
    </header>

    <section class="wrap">
      <div class="cs-body">
        <div>
          <div class="cs-block" data-reveal>
            <h3>Overview</h3>
            <div id="cs-overview"></div>
          </div>
          <div class="cs-block" id="cs-metrics-wrap" data-reveal>
            <h3>At a glance</h3>
            <div class="cs-metrics" id="cs-metrics"></div>
          </div>
          <div class="cs-block" data-reveal>
            <h3>Highlights &amp; my contribution</h3>
            <ul class="cs-highlights" id="cs-highlights"></ul>
          </div>
          <div class="cs-block" id="cs-gallery-wrap" data-reveal>
            <h3>Screens</h3>
            <div class="cs-gallery" id="cs-gallery"></div>
          </div>
          <a href="index.html#work" class="btn btn--ghost">← All projects</a>
        </div>

        <aside class="cs-info" data-reveal data-reveal-delay="1">
          <dl>
            <div><dt>Category</dt><dd id="cs-category"></dd></div>
            <div><dt>My role</dt><dd id="cs-role"></dd></div>
            <div><dt>Timeline</dt><dd id="cs-timeline"></dd></div>
            <div><dt>Client / context</dt><dd id="cs-client"></dd></div>
            <div><dt>Status</dt><dd id="cs-status"></dd></div>
            <div><dt>Tech stack</dt><dd class="stack-min" id="cs-stack"></dd></div>
            <div><dt>Links</dt><dd class="cs-links" id="cs-link"></dd></div>
          </dl>
        </aside>
      </div>

      <nav class="cs-next" id="cs-next" aria-label="More projects"></nav>
    </section>
  </main>

  <footer class="footer wrap">
    <div class="footer__row">
      <p>© <span id="year">2026</span> Adonis T Mushonga</p>
      <a href="index.html" class="top">Home ↑</a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot viewer">
    <span class="lightbox__count" id="lb-count"></span>
    <button class="lightbox__close" id="lb-close" type="button">Close ✕</button>
    <button class="lightbox__btn prev" id="lb-prev" type="button" aria-label="Previous">←</button>
    <img id="lb-img" src="" alt="">
    <button class="lightbox__btn next" id="lb-next" type="button" aria-label="Next">→</button>
    <p class="lightbox__cap" id="lb-cap"></p>
  </div>

  <script src="assets/js/projects.js?v=4"></script>
  <script src="assets/js/shots.js?v=4"></script>
  <script>
    (function () {
      function qs(n){ return new URLSearchParams(location.search).get(n); }
      function el(id){ return document.getElementById(id); }
      function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
      var y = el("year"); if (y) y.textContent = new Date().getFullYear();

      var ORDER = window.PROJECT_ORDER || [];
      var slug = qs("p"); var p = slug && window.PROJECTS && window.PROJECTS[slug];
      if (!p) {
        el("cs-title").textContent = "Project not found";
        el("cs-tagline").textContent = "That project could not be found.";
        el("cs-overview").innerHTML = '<p><a href="index.html#work">Return to the work index →</a></p>';
        el("cs-metrics-wrap").style.display = "none";
        el("cs-gallery-wrap").style.display = "none";
        return;
      }
      var S = (window.SHOTS && window.SHOTS[slug]) || null;
      var shots = S ? S.shots : [];
      var mobile = p.kind === "mobile";
      var fallback = "assets/img/portfolio/" + slug + ".svg";

      document.title = p.title + " — Adonis T Mushonga";
      el("cs-title").textContent = p.title;
      el("cs-tagline").textContent = p.tagline;

      /* Cover */
      var cover = el("cs-cover");
      var phoneShots = shots.filter(function (s) { return (s.kind || (S && S.kind)) === "mobile"; });
      if (mobile && phoneShots.length) {
        cover.className = "cs-cover cs-cover--phone";
        cover.innerHTML = phoneShots.slice(0, 3).map(function (s) {
          return '<div class="phone"><img src="' + s.src + '" alt="' + esc(s.cap || p.title) + '"></div>';
        }).join("");
      } else {
        var src = S ? S.cover : fallback;
        cover.innerHTML =
          '<div class="frame"><div class="frame__bar"><i></i><i></i><i></i><span class="frame__url">' + esc(p.url || p.title) + '</span></div>' +
          '<div class="frame__body"><img src="' + src + '" alt="' + esc(p.title) + '" onerror="this.onerror=null;this.src=\'' + fallback + '\'"></div></div>';
      }

      el("cs-overview").innerHTML = p.overview.map(function(t){ return "<p>"+t+"</p>"; }).join("");
      if (p.metrics && p.metrics.length) {
        el("cs-metrics").innerHTML = p.metrics.map(function(m){ return '<div class="cs-metric"><div class="n">'+m.n+'</div><div class="l">'+m.l+'</div></div>'; }).join("");
      } else { el("cs-metrics-wrap").style.display = "none"; }
      el("cs-highlights").innerHTML = p.highlights.map(function(h){ return "<li>"+h+"</li>"; }).join("");
      el("cs-category").textContent = p.category;
      el("cs-role").textContent = p.role;
      el("cs-timeline").textContent = p.timeline;
      el("cs-client").textContent = p.client;
      el("cs-status").textContent = p.status;
      el("cs-stack").innerHTML = p.stack.map(function(s){ return "<span>"+s+"</span>"; }).join("");

      var links = [];
      if (p.links && p.links.live) links.push('<a class="live" href="'+p.links.live+'" target="_blank" rel="noopener">Visit live site ↗</a>');
      if (p.links && p.links.repo) links.push('<a href="'+p.links.repo+'" target="_blank" rel="noopener">Source ↗</a>');
      if (!links.length) links.push('<a href="index.html#contact">Private — walkthrough on request ↗</a>');
      el("cs-link").innerHTML = links.join("");

      /* Gallery */
      var gal = el("cs-gallery");
      if (!shots.length) { el("cs-gallery-wrap").style.display = "none"; }
      else {
        var allPhone = phoneShots.length === shots.length;
        gal.className = "cs-gallery" + (allPhone ? " cs-gallery--phone" : "");
        gal.innerHTML = shots.map(function (s, i) {
          var cap = esc(s.cap || (p.title + " — screen " + (i + 1)));
          if ((s.kind || (S && S.kind)) === "mobile") return '<figure class="shot" data-i="'+i+'"><div class="phone"><img src="'+s.src+'" alt="'+cap+'" loading="lazy"></div><figcaption>'+cap+'</figcaption></figure>';
          var wide = (i === 0 && shots.length % 2 === 1) ? " shot--wide" : "";
          return '<figure class="shot'+wide+'" data-i="'+i+'"><div class="frame"><div class="frame__bar"><i></i><i></i><i></i><span class="frame__url">'+esc(p.url||"")+'</span></div><div class="frame__body"><img src="'+(wide ? s.src : s.thumb || s.src)+'" alt="'+cap+'" loading="lazy"></div></div><figcaption>'+cap+'</figcaption></figure>';
        }).join("");
      }

      /* Lightbox */
      var lb = el("lightbox"), lbImg = el("lb-img"), lbCap = el("lb-cap"), lbCount = el("lb-count"), cur = 0;
      function show(i) {
        cur = (i + shots.length) % shots.length;
        lbImg.src = shots[cur].src; lbImg.alt = shots[cur].cap || "";
        lbCap.textContent = shots[cur].cap || ""; lbCount.textContent = (cur + 1) + " / " + shots.length;
        lb.classList.add("open"); document.body.style.overflow = "hidden";
      }
      function hide(){ lb.classList.remove("open"); document.body.style.overflow = ""; }
      gal.addEventListener("click", function (e) { var f = e.target.closest(".shot"); if (f) show(+f.getAttribute("data-i")); });
      el("lb-prev").addEventListener("click", function(){ show(cur - 1); });
      el("lb-next").addEventListener("click", function(){ show(cur + 1); });
      el("lb-close").addEventListener("click", hide);
      lb.addEventListener("click", function (e) { if (e.target === lb) hide(); });
      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") hide(); else if (e.key === "ArrowLeft") show(cur - 1); else if (e.key === "ArrowRight") show(cur + 1);
      });

      /* Prev / next project */
      var idx = ORDER.indexOf(slug);
      if (idx >= 0 && ORDER.length > 1) {
        var prev = ORDER[(idx - 1 + ORDER.length) % ORDER.length], next = ORDER[(idx + 1) % ORDER.length];
        el("cs-next").innerHTML =
          '<a href="portfolio-details.html?p='+prev+'"><span class="k">← Previous</span><span class="t">'+window.PROJECTS[prev].title+'</span></a>' +
          '<a href="portfolio-details.html?p='+next+'"><span class="k">Next →</span><span class="t">'+window.PROJECTS[next].title+'</span></a>';
      }
    })();
  </script>
  <script src="assets/js/site.js?v=4"></script>
</body>
</html>
